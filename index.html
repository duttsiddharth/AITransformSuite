<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9333ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI IT Ops" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>AI IT Ops Transformation Toolkit · Siddharth Dutt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
    // Only register SW when served from a real host (not Claude preview, not file://)
    const _host = location.hostname;
    const _skip = _host === '' || _host === 'localhost' && false ||
                  _host.includes('claudeusercontent.com') ||
                  _host.includes('claude.ai');
    if ('serviceWorker' in navigator && !_skip) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('[PWA] SW registered:', r.scope))
          .catch(e => console.warn('[PWA] SW failed:', e));
      });
    }
  </script>
  </body>
</html>
